[package]
name = "private-discovery"
version = "0.1.0"
edition = "2024"
publish = false
description = "Fustor private data discovery and bounded data action map model"

[lib]
path = "src/lib.rs"

[dependencies]
capanix-app-sdk = { workspace = true }
data-view = { workspace = true }
csv-source = { workspace = true }
es-source = { workspace = true }
jsonl-source = { workspace = true }
local-fs-source = { workspace = true }
mysql-source = { workspace = true }
pg-source = { workspace = true }
ring = "0.17"
s3-source = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
union-graph = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
