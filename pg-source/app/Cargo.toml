[package]
name = "pg-source-runtime"
version = "0.1.0"
edition = "2024"
publish = false
description = "PostgreSQL source deployable runtime artifact package"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
# One-shot tools embed services, not the shared-library plugin entry symbol.
embedded-inspection = []

[dependencies]
async-trait = { workspace = true }
capanix-app-sdk = { workspace = true }
capanix-runtime-entry-sdk = { workspace = true }
pg-source = { workspace = true }
native-tls = { workspace = true }
postgres = { workspace = true }
postgres-native-tls = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
source-kit = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
source-test-kit = { workspace = true }
