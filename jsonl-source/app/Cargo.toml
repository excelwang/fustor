[package]
name = "jsonl-source-runtime"
version = "0.1.0"
edition = "2024"
publish = false
description = "Jsonl-compatible source deployable runtime artifact package"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
# One-shot tools embed services, not the shared-library plugin entry symbol.
embedded-inspection = []

[dependencies]
async-trait = { workspace = true }
capanix-app-sdk = { workspace = true }
capanix-runtime-entry-sdk = { workspace = true }
rmp-serde = { workspace = true }
jsonl-source = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
source-kit = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
source-test-kit = { workspace = true }
tempfile = { workspace = true }
