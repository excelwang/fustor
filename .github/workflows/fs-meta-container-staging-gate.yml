name: fs-meta-container-staging-gate

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Container staging suite: active-three, mini, all (active-three + blocking mini), or l5:<stage>"
        required: true
        default: "all"
      require_mini:
        description: "For suite=all, keep mini blocking; set false only for diagnostic runs"
        required: true
        type: boolean
        default: true
      capanix_ref:
        description: "capanix ref to checkout beside fustor"
        required: true
        default: "data-action-map"

concurrency:
  group: fs-meta-container-staging-gate-${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  fs-meta-container-staging-gate:
    runs-on: [self-hosted, linux, privileged]
    steps:
      - name: Checkout fustor
        uses: actions/checkout@v4
        with:
          path: fustor
      - name: Checkout capanix
        uses: actions/checkout@v4
        with:
          repository: excelwang/capanix
          ref: ${{ inputs.capanix_ref }}
          path: capanix
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fustor
            capanix
      - name: Run container staging gate
        working-directory: fustor
        env:
          CAPANIX_REPO_ROOT: ${{ github.workspace }}/capanix
          FSMETA_CONTAINER_STAGING_REQUIRE_MINI: ${{ inputs.require_mini && '1' || '0' }}
        run: ./fs-meta/scripts/fs-meta-container-staging-gate.sh run "${{ inputs.suite }}"
